<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; background: #f8fafc; color: #0f172a; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 680px; width: 100%; background: #fff; border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; }
    .media { position: relative; aspect-ratio: 16/9; background: #f1f5f9; }
    .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .content { padding: 20px; }
    .title { font-weight: 700; font-size: 18px; margin: 0 0 8px; }
    .desc { font-size: 14px; color: #334155; margin: 0 0 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(to right, #f59e0b, #d97706); color: #fff; padding: 10px 16px; border-radius: 12px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="media">
        <img src="/assets/photo_couple-CGscjKL8.jpg" alt="Photo du couple">
      </div>
      <div class="content">
        <h1 class="title">Invitation Spéciale</h1>
        <p class="desc">Cliquez ci-dessous pour voir votre invitation personnalisée.</p>
        <a id="cta" class="btn" href="#" target="_blank" rel="noopener">Voir l'invitation</a>
      </div>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var url = params.get('url');
    if (url) {
      var cta = document.getElementById('cta');
      if (cta) cta.href = url;
    }
  </script>
</body>
</html>
